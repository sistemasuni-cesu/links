<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensalamento 2026.2 — Consulta de Salas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #EE6C0C;
    --orange-deep: #C9500A;
    --orange-soft: #FFE7D3;
    --navy: #1A2138;
    --navy-soft: #4A5170;
    --bg: #F7F4EF;
    --paper: #FFFFFF;
    --line: #E9E3D9;
    --ink: #24283B;
    --ink-mute: #6B7089;

    /* Sinalização por andar — cada andar tem uma cor fixa, usada em toda a página */
    --f-m2: #3B5BA5;   /* -2 */
    --f-m1: #4E8CA6;   /* -1 */
    --f-t:  #3F8F5F;   /* Térreo */
    --f-1:  #C9860B;   /* 1° */
    --f-2:  #C9500A;   /* 2° */
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Poppins', sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HEADER ---------- */
  header{
    background: linear-gradient(135deg, var(--navy) 0%, #262E4C 100%);
    color:#fff;
    padding:28px 24px 22px;
    position:relative;
    overflow:hidden;
  }
  html{-webkit-text-size-adjust:100%;}
  header::before{
    content:"";
    position:absolute;
    top:-60%; right:-10%;
    width:420px; height:420px;
    background: radial-gradient(circle, rgba(238,108,12,0.35) 0%, rgba(238,108,12,0) 70%);
    pointer-events:none;
  }
  .header-inner{
    max-width:1100px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange);
    background:rgba(238,108,12,0.14);
    border:1px solid rgba(238,108,12,0.4);
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .eyebrow span.dot{width:6px;height:6px;border-radius:50%;background:var(--orange);}
  h1{
    font-size:clamp(26px, 4vw, 38px);
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.15;
  }
  header p.sub{
    margin-top:8px;
    color:#C4C9DE;
    font-size:15px;
    font-weight:400;
    max-width:560px;
  }

  /* ---------- SEARCH BAR (sticky, leve — evita bug de repaint no Android/Chrome) ---------- */
  .search-bar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 14px rgba(26,33,56,0.06);
    /* força camada de composição própria: evita a área ficar "em branco" ao rolar no Chrome Android */
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }
  .search-wrap{
    position:relative;
    max-width:1100px;
    margin:0 auto;
    padding:14px 24px;
  }
  .search-wrap svg{
    position:absolute;
    left:38px; top:50%;
    transform:translateY(-50%);
    color:var(--ink-mute);
    pointer-events:none;
  }
  #search{
    width:100%;
    padding:12px 14px 12px 42px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-family:'Poppins', sans-serif;
    font-size:14.5px;
    font-weight:500;
    background:var(--bg);
    color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  #search::placeholder{color:var(--ink-mute); font-weight:400;}
  #search:focus{
    outline:none;
    border-color:var(--orange);
    background:#fff;
  }

  /* ---------- FILTERS (fluxo normal, não sticky) ---------- */
  .filters{
    max-width:1100px;
    margin:0 auto;
    padding:16px 24px 4px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
  }

  .seg{
    display:flex;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:3px;
    gap:2px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .seg::-webkit-scrollbar{display:none;}
  .seg button{
    font-family:'Poppins', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-mute);
    background:transparent;
    border:none;
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
    flex-shrink:0;
  }
  .seg button.active{
    background:var(--navy);
    color:#fff;
  }
  .seg button:hover:not(.active){color:var(--ink);}

  .floor-chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    width:100%;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'Poppins', sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px 8px 10px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-mute);
    cursor:pointer;
    transition:all .15s;
    flex-shrink:0;
    min-height:36px;
  }
  .chip .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .chip.active{
    color:#fff;
    border-color:transparent;
  }
  .chip:hover{transform:translateY(-1px);}

  #resultCount{
    max-width:1100px;
    margin:0 auto;
    padding:14px 24px 4px;
    font-size:13px;
    font-weight:500;
    color:var(--ink-mute);
  }
  #resultCount b{color:var(--navy); font-weight:700;}

  /* ---------- GRID ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding:8px 24px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    gap:16px;
    margin-top:14px;
  }

  .card{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:20px 20px 8px;
    transition:box-shadow .2s, transform .2s, border-color .2s;
  }
  .card:hover{
    box-shadow:0 10px 28px rgba(26,33,56,0.09);
    transform:translateY(-2px);
    border-color:#DCD4C4;
  }

  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:14px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--line);
  }
  .course-name{
    font-size:15.5px;
    font-weight:700;
    color:var(--navy);
    line-height:1.3;
    letter-spacing:-.01em;
  }
  .turno-badge{
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:8px;
    white-space:nowrap;
  }
  .turno-badge.MA{background:var(--orange-soft); color:var(--orange-deep);}
  .turno-badge.NA{background:#232A44; color:#C4C9DE;}

  .row{
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #F1EDE4;
  }
  .row:last-child{border-bottom:none;}
  .turma{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .sala{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    background:var(--bg);
    padding:4px 10px;
    border-radius:7px;
    min-width:52px;
    text-align:center;
  }
  .andar-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    color:#fff;
    white-space:nowrap;
    min-width:64px;
    justify-content:center;
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-mute);
  }
  .empty svg{margin-bottom:14px; opacity:.5;}
  .empty p{font-size:14.5px; font-weight:500;}

  /* ---------- LEGEND ---------- */
  .legend-section{
    max-width:1100px;
    margin:36px auto 0;
    padding:0 24px;
  }
  .legend-box{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
  }
  .legend-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-mute);
    margin-bottom:14px;
  }
  .legend-strip{
    display:flex;
    border-radius:10px;
    overflow:hidden;
    height:44px;
    margin-bottom:4px;
  }
  .legend-strip div{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.02em;
  }

  footer{
    text-align:center;
    padding:26px 24px 40px;
    font-size:12.5px;
    color:var(--ink-mute);
  }

  /* ---------- TABLET ---------- */
  @media (max-width:768px){
    header{padding:22px 18px 18px;}
    .search-wrap, .filters, #resultCount, main, .legend-section{
      padding-left:18px;
      padding-right:18px;
    }
    .search-wrap svg{left:32px;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));}
  }

  /* ---------- MOBILE ---------- */
  @media (max-width:640px){
    header{padding:20px 16px 16px;}
    h1{font-size:22px;}
    header p.sub{font-size:13.5px;}
    .eyebrow{font-size:10.5px; padding:4px 10px;}

    .search-wrap, .filters, #resultCount, main, .legend-section{
      padding-left:16px;
      padding-right:16px;
    }
    .search-wrap{padding-top:12px; padding-bottom:12px;}
    .search-wrap svg{left:30px;}
    .filters{flex-direction:column; align-items:stretch; padding-top:14px; padding-bottom:10px; gap:10px;}
    #search{padding:13px 14px 13px 42px; font-size:16px;} /* 16px evita zoom automático no iOS */
    .seg{overflow-x:auto; width:100%;}
    .seg button{padding:10px 14px; font-size:13px;}

    .floor-chips{gap:7px;}
    .chip{font-size:12px; padding:7px 12px 7px 9px;}

    #resultCount{font-size:12.5px; padding-top:12px;}

    .grid{grid-template-columns:1fr; gap:12px; margin-top:10px;}
    .card{padding:16px 16px 6px; border-radius:14px;}
    .course-name{font-size:14.5px;}
    .card-head{margin-bottom:12px; padding-bottom:12px;}
    .turno-badge{font-size:10px; padding:4px 8px;}

    .row{grid-template-columns:1fr auto; row-gap:6px; padding:10px 0;}
    .turma{font-size:13px;}
    .sala{font-size:12.5px; padding:4px 9px; min-width:44px;}
    .andar-badge{grid-column:1/-1; justify-self:start; margin-top:-2px;}

    .legend-section{margin-top:26px;}
    .legend-box{padding:16px 16px;}
    .legend-strip{
      flex-direction:column;
      height:auto;
      gap:1px;
    }
    .legend-strip div{
      height:38px;
      font-size:12px;
    }

    footer{padding:20px 16px 32px; font-size:11.5px;}
  }

  /* ---------- MOBILE PEQUENO ---------- */
  @media (max-width:380px){
    h1{font-size:20px;}
    .row{grid-template-columns:1fr;}
    .sala{justify-self:start;}
    .andar-badge{margin-top:0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; scroll-behavior:auto !important;}
  }

  :focus-visible{outline:2.5px solid var(--orange); outline-offset:2px;}
</style>
</head>

  const r = raw.trim().toUpperCase().replace("º","°");

    {turma:"FIS8S-NA", sala:"22", andar:"TÉRREO"},
    {turma:"FIS10S-NA", sala:"06", andar:"-1"},
  ]},
  {curso:"Farmácia", turno:"NA", salas:[
    {turma:"FAR2S-NA", sala:"19", andar:"TÉRREO"},
    {turma:"FAR4S-NA", sala:"17", andar:"TÉRREO"},
    {turma:"FAR6S-NA", sala:"18", andar:"TÉRREO"},
    {turma:"FAR8S-NA", sala:"20", andar:"TÉRREO"},

  {curso:"Psicologia", turno:"NA", salas:[

    {turma:"PSI8S-NA", sala:"13", andar:"-1"},

  {curso:"Processos Gerenciais", turno:"NA", salas:[

  ]},
  {curso:"Pedagogia", turno:"NA", salas:[

  ]},

    {turma:"NUT4S-NA", sala:"31", andar:"TÉRREO"},
    {turma:"NUT6S-NA", sala:"33", andar:"TÉRREO"},
  ]},
];

// state
let activeTurno = "ALL";
let activeFloors = new Set();
let query = "";

// build floor chips
const floorChipsEl = document.getElementById("floorChips");
Object.entries(FLOORS).forEach(([key, f])=>{
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.dataset.floor = key;
  chip.style.setProperty("--chip-color", f.color);
  chip.innerHTML = `<span class="sw" style="background:${f.color}"></span>${f.label}`;
  chip.addEventListener("click", ()=>{
    if(activeFloors.has(key)){
      activeFloors.delete(key);
      chip.classList.remove("active");
      chip.style.background = "#fff";
      chip.style.color = "";
    } else {
      activeFloors.add(key);
      chip.classList.add("active");
      chip.style.background = f.color;
      chip.style.color = "#fff";
    }
    render();
  });
  floorChipsEl.appendChild(chip);
});

// build legend strip
const legendStripEl = document.getElementById("legendStrip");
Object.values(FLOORS).forEach(f=>{
  const div = document.createElement("div");
  div.style.background = f.color;
  div.textContent = f.name;
  legendStripEl.appendChild(div);
});

// turno segmented control
document.getElementById("turnoSeg").addEventListener("click", (e)=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  document.querySelectorAll("#turnoSeg button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  activeTurno = btn.dataset.turno;
  render();
});

document.getElementById("search").addEventListener("input", (e)=>{
  query = e.target.value.trim().toLowerCase();
  render();
});

function matches(course, item){
  if(activeTurno !== "ALL" && course.turno !== activeTurno) return false;
  if(activeFloors.size > 0 && !activeFloors.has(normFloor(item.andar))) return false;
  if(query){
    const hay = `${course.curso} ${item.turma} ${item.sala}`.toLowerCase();
    if(!hay.includes(query)) return false;
  }
  return true;
}

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let totalRooms = 0;
  let totalCourses = 0;

  DATA.forEach(course=>{
    const rows = course.salas.filter(item=>matches(course, item));
    if(rows.length === 0) return;
    totalCourses++;
    totalRooms += rows.length;

    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `
      <div class="course-name">${course.curso}</div>
      <div class="turno-badge ${course.turno}">${course.turno === "MA" ? "Matutino" : "Noturno"}</div>
    `;
    card.appendChild(head);

    rows.forEach(item=>{
      const f = FLOORS[normFloor(item.andar)] || {label:item.andar, color:"#999"};
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="turma">${item.turma}</div>
        <div class="sala">${item.sala}</div>
        <div class="andar-badge" style="background:${f.color}">${f.label}</div>
      `;
      card.appendChild(row);
    });

    grid.appendChild(card);
  });

  if(totalCourses === 0){
    grid.innerHTML = `
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p>Nenhuma sala encontrada para essa busca.</p>
      </div>`;
  }

  document.getElementById("resultCount").innerHTML =
    `<b>${totalCourses}</b> curso${totalCourses===1?"":"s"} &middot; <b>${totalRooms}</b> turma${totalRooms===1?"":"s"} encontrada${totalRooms===1?"":"s"}`;
}

render();
</script>
